<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Fit · Cliente del Web Service</title>
<style>
:root{--ink:#14161A;--paper:#EDEFF1;--line:#D5D9DE;--muted:#5B636C;--yellow:#FFC400;--ok:#1F7A4D;--bad:#C8321E;--code:#171A1F;--codeink:#E4E7EB}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
header{background:var(--ink);border-bottom:6px solid var(--yellow);padding:1rem 1.5rem}
header h1{margin:0;color:var(--yellow);font:700 1.9rem/1 "Arial Narrow",Arial,sans-serif}
header p{margin:.2rem 0 0;color:#B8BEC6;font-size:.92rem}
main{max-width:1200px;margin:1.5rem auto;padding:0 1.5rem;display:grid;grid-template-columns:340px 1fr;gap:1.25rem;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:1.1rem}
h2{margin:0 0 .6rem;font-size:1.15rem}
label{display:block;font-weight:600;font-size:.88rem;margin:.7rem 0 .2rem}
input,select{width:100%;padding:.5rem .6rem;font:inherit;border:1.5px solid #9AA2AB;border-radius:6px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
button{margin-top:1rem;padding:.6rem 1.1rem;font:700 1rem Arial,sans-serif;background:var(--yellow);border:2px solid var(--ink);border-radius:6px;cursor:pointer}
.endpoint{font:.82rem ui-monospace,Consolas,monospace;background:#F4F5F7;border:1px solid var(--line);border-radius:6px;padding:.45rem .6rem;word-break:break-all}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
@media(max-width:1100px){.cols{grid-template-columns:1fr}}
pre{margin:0;background:var(--code);color:var(--codeink);border-radius:6px;padding:.8rem;font:.8rem/1.45 ui-monospace,Consolas,monospace;overflow:auto;min-height:11rem;white-space:pre-wrap;word-break:break-word}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem;font-size:.9rem}
.chip{padding:.05rem .6rem;border-radius:99px;font-weight:600;font-size:.85rem;border:1.5px solid}
.chip.ok{color:var(--ok);background:#DDF3E7}.chip.err{color:var(--bad);background:#FBE3DF}
.res{margin-top:1.25rem}
.promo{display:flex;justify-content:space-between;align-items:center;gap:1rem;border:1.5px solid var(--ink);border-radius:8px;padding:.7rem .9rem;margin-top:.6rem}
.promo button{margin:0;padding:.4rem .9rem;flex:none}
dl{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;margin:.5rem 0 0}dt{color:var(--muted)}dd{margin:0;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:.5rem}
th,td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--line)}th{border-bottom:2px solid var(--ink);color:var(--muted)}
</style>
</head>
<body>
<header><h1>Smart Fit</h1><p>Cliente del Web Service · request y response en XML</p></header>
<main>
  <section class="card">
    <h2>Armar solicitud</h2>
    <div class="endpoint">POST <span id="ep"></span>/ws/smartfit</div>
    <label for="op">Operación</label>
    <select id="op"></select>
    <div id="campos"></div>
    <button id="enviar" type="button">Enviar solicitud</button>
  </section>

  <section>
    <div class="cols">
      <div><div class="bar"><b>Request (XML)</b></div><pre id="req"></pre></div>
      <div><div class="bar"><b>Response (XML)</b><span id="estado"></span></div><pre id="resx">Envía una solicitud para ver la respuesta.</pre></div>
    </div>
    <div class="card res" id="resumen" hidden></div>
  </section>
</main>

<script>
const NS = "http://smartfit.uadeo.mx/ws";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const OPS = {
  consultarMembresia: ["userId"],
  registrarUsuario:   ["userId", "nombre", "plan", "sucursal"],
  registrarAcceso:    ["userId"],
  reservarClase:      ["userId", "clase"],
  completarRutina:    ["userId"],
  consultarHistorial: ["userId", "limite"],
  consultarPromociones: ["userId"],
  canjearPromocion:     ["userId", "codigo"],
  consultarSegmentos:   [],
};
const CAMPOS = {
  userId:   { t: "Número de socio", tipo: "text", val: "23050292" },
  nombre:   { t: "Nombre completo", tipo: "text", val: "" },
  plan:     { t: "Plan", tipo: "select", opc: ["Smart", "Black"] },
  sucursal: { t: "Sucursal", tipo: "select", opc: ["Mazatlán Centro", "Mazatlán Norte", "Mazatlán Marina"] },
  clase:    { t: "Clase", tipo: "select", opc: ["Spinning", "Zumba", "Yoga", "Funcional", "Box", "Pilates"] },
  limite:   { t: "Límite de eventos (opcional)", tipo: "number", val: "10" },
  codigo:   { t: "Código de la promoción", tipo: "text", val: "BIENVENIDA20" },
};

$("#ep").textContent = location.origin;
$("#op").innerHTML = Object.keys(OPS).map(o => `<option>${o}</option>`).join("");

function pintarCampos() {
  $("#campos").innerHTML = OPS[$("#op").value].map(k => {
    const c = CAMPOS[k];
    const ctl = c.tipo === "select"
      ? `<select id="f-${k}">${c.opc.map(o => `<option>${o}</option>`).join("")}</select>`
      : `<input id="f-${k}" type="${c.tipo}" value="${c.val}" ${k === "userId" ? 'inputmode="numeric"' : ""}>`;
    return `<label for="f-${k}">${c.t}</label>${ctl}`;
  }).join("");
  document.querySelectorAll("#campos input,#campos select").forEach(e => e.addEventListener("input", armar));
  armar();
}

function armar() {
  const params = OPS[$("#op").value]
    .map(k => [k, $("#f-" + k).value.trim()]).filter(([, v]) => v !== "")
    .map(([k, v]) => `    <${k}>${esc(v)}</${k}>`).join("\n");
  const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<SolicitudSmartFit xmlns="${NS}">\n  <operacion>${$("#op").value}</operacion>\n  <parametros>\n${params}\n  </parametros>\n</SolicitudSmartFit>`;
  $("#req").textContent = xml;
  return xml;
}

const txt = (n, tag) => n.getElementsByTagNameNS(NS, tag)[0]?.textContent ?? "";

function mostrar(xmlTexto) {
  const doc = new DOMParser().parseFromString(xmlTexto, "application/xml");
  const caja = $("#resumen");
  if (doc.querySelector("parsererror")) { caja.hidden = true; return; }
  const ok = txt(doc, "estado") === "OK";
  let html = `<h2>${esc(txt(doc, "mensaje"))}</h2>`;
  const socio = doc.getElementsByTagNameNS(NS, "socio")[0];
  if (socio) {
    const clases = [...socio.getElementsByTagNameNS(NS, "clase")].map(c => c.textContent).join(", ") || "Ninguna";
    html += `<dl><dt>Socio</dt><dd>${esc(txt(socio, "userId"))} · ${esc(txt(socio, "nombre"))}</dd>
      <dt>Plan</dt><dd>${esc(txt(socio, "plan"))}</dd><dt>Sucursal</dt><dd>${esc(txt(socio, "sucursal"))}</dd>
      <dt>Membresía</dt><dd>${txt(socio, "membresiaActiva") === "true" ? "Activa" : "Inactiva"}</dd>
      <dt>Accesos</dt><dd>${esc(txt(socio, "accesos"))}</dd><dt>Rutinas completadas</dt><dd>${esc(txt(socio, "rutinasCompletadas"))}</dd>
      <dt>Clases reservadas</dt><dd>${esc(clases)}</dd>
      <dt>Segmento de marketing</dt><dd><span class="chip ok">${esc(txt(socio, "segmento"))}</span></dd></dl>`;
  }
  const mk = doc.getElementsByTagNameNS(NS, "marketing")[0];
  if (mk) {
    const promos = [...mk.getElementsByTagNameNS(NS, "promocion")];
    html += `<p>Segmento: <span class="chip ok">${esc(txt(mk, "segmento"))}</span></p>` +
      (promos.length ? promos.map(p => `<div class="promo"><div><b>${esc(txt(p, "titulo"))}</b>
          <span class="chip ok">${esc(txt(p, "descuentoPct"))}% off</span><br>${esc(txt(p, "descripcion"))}
          <br><small>Código ${esc(txt(p, "codigo"))} · vigente hasta ${esc(txt(p, "vigenteHasta"))}</small></div>
          ${txt(doc, "codigo") === "200" ? `<button type="button" data-canjear="${esc(txt(p, "codigo"))}">Canjear</button>` : ""}</div>`).join("")
        : `<p>No hay promociones disponibles para este socio.</p>`);
  }
  const segs = [...doc.getElementsByTagNameNS(NS, "segmento")].filter(x => x.getElementsByTagNameNS(NS, "nombre").length);
  if (segs.length) {
    html += `<table><tr><th>Segmento</th><th>Socios</th></tr>` +
      segs.map(x => `<tr><td>${esc(txt(x, "nombre"))}</td><td>${esc(txt(x, "total"))}</td></tr>`).join("") + `</table>`;
  }
  const evs = [...doc.getElementsByTagNameNS(NS, "evento")];
  if (doc.getElementsByTagNameNS(NS, "eventos").length) {
    html += evs.length ? `<table><tr><th>Fecha</th><th>Socio</th><th>Evento</th><th>Detalle</th></tr>` +
      evs.map(e => `<tr><td>${esc(txt(e, "fecha").replace("T", " "))}</td><td>${esc(txt(e, "userId"))}</td><td>${esc(txt(e, "tipo"))}</td><td>${esc(txt(e, "detalle"))}</td></tr>`).join("") + `</table>`
      : `<p>No hay eventos registrados.</p>`;
  }
  caja.innerHTML = html; caja.hidden = false;
}

$("#enviar").addEventListener("click", async () => {
  const est = $("#estado");
  try {
    const r = await fetch("/ws/smartfit", { method: "POST", headers: { "Content-Type": "application/xml" }, body: armar() });
    const t = await r.text();
    $("#resx").textContent = t;
    est.innerHTML = `<span class="chip ${r.ok ? "ok" : "err"}">HTTP ${r.status}</span>`;
    mostrar(t);
  } catch (e) {
    $("#resx").textContent = "No se pudo conectar con el servicio.";
    est.innerHTML = `<span class="chip err">Sin conexión</span>`;
  }
});
$("#resumen").addEventListener("click", e => {
  const b = e.target.closest("button[data-canjear]");
  if (!b) return;
  const uid = $("#f-userId").value;
  $("#op").value = "canjearPromocion"; pintarCampos();
  $("#f-userId").value = uid; $("#f-codigo").value = b.dataset.canjear;
  $("#enviar").click();
});
$("#op").addEventListener("change", pintarCampos);
pintarCampos();
</script>
</body>
</html>
